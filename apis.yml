aid: pointcheckout
name: PointCheckout
description: >-
  PointCheckout is a MENA-region payments and rewards platform, backed by 500
  Global, that lets shoppers pay online with reward points and miles and lets
  merchants accept card and rewards payments. Its developer-facing Merchant API
  (powered by paymennt.com) exposes hosted web, payment-link, QR, and mobile
  checkouts, recurring subscriptions, merchant branches, and HMAC-signed
  webhooks. The API is RESTful JSON, versioned in the URI path (v2.0), secured
  with an API key and secret header pair, and ships with a separate test
  environment plus iOS/Android SDKs and e-commerce plugins for Magento 2,
  WooCommerce, OpenCart, and Shopify.
